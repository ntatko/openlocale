name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlocale
          POSTGRES_PASSWORD: openlocale
          POSTGRES_DB: openlocale
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openlocale"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:pg
        env:
          OPENLOCALE_TEST_PG_URL: postgres://openlocale:openlocale@localhost:5433/openlocale
