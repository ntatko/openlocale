name: Publish npm packages

# Publishes the public @openlocale/* packages (sdk, cli, i18next-backend) to
# npm on version tags (v1.2.3), matching the tag scheme docker-publish.yml
# uses for image tags. The tagged commit's package.json already carries the
# right version — it was set by the Release workflow (.github/workflows/
# release.yml), which runs `changeset version` and commits the bump before
# tagging. Packages marked "private" (formats, dedupe, and everything under
# apps/tools/examples) are skipped by `pnpm -r publish` and never touched.
#
# Requires an npm automation token in the NPM_TOKEN repository *secret*
# (Settings -> Secrets and variables -> Actions -> Secrets), scoped to
# publish under the @openlocale org on npmjs.com.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@openlocale"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Publish
        run: |
          pnpm --filter "@openlocale/sdk" --filter "@openlocale/cli" --filter "@openlocale/i18next-backend" \
            publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
