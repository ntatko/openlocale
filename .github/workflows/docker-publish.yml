name: Publish Docker image

# Pushes ghcr.io/<owner>/openlocale to GitHub Container Registry:
#   - `latest` + `sha-…` on every push to main
#   - `X.Y.Z`, `X.Y`, `latest` on version tags (v1.2.3)
# Auth is via the built-in GITHUB_TOKEN (packages: write below) — no registry
# secrets to manage. (Docker Hub publishing may come back later; GHCR is the
# only registry for now.)
#
# On push to main, deploy-demo then rolls the freshly published sha-… tag out to
# the openlocale-demo Deployment via a self-hosted runner (see
# deploy/k8s/demo-runner.yaml) that only this workflow's push-to-main trigger can
# reach — do not add a pull_request trigger to a job using the openlocale-demo
# runner label, the repo is public.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, openlocale-demo]
    steps:
      - uses: azure/setup-kubectl@v4

      - run: |
          IMAGE="${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          kubectl -n openlocale-demo set image deployment/openlocale-demo openlocale=$IMAGE
          kubectl -n openlocale-demo rollout status deployment/openlocale-demo --timeout=180s
