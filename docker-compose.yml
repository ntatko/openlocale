services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openlocale
      POSTGRES_PASSWORD: openlocale
      POSTGRES_DB: openlocale
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlocale"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local OIDC identity provider for testing SSO connectors:
  #   docker compose up -d dex
  # then register a connector with issuer http://localhost:5556/dex,
  # client id "openlocale", secret "openlocale-secret", domain "example.com";
  # log in as admin@example.com / password
  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dev/dex-config.yaml:/etc/dex/config.yaml:ro

volumes:
  pgdata:
