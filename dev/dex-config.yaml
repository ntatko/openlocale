# dex config for local SSO testing (see docker-compose.yml)
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

# dex does not support wildcard redirect URIs — the callback path is
# deterministic: /api/auth/sso/callback/<org-slug>-<email-domain-with-dashes>.
# Adjust "acme" to your org slug if it differs.
staticClients:
  - id: openlocale
    redirectURIs:
      - "http://localhost:5199/api/auth/sso/callback/acme-example-com"
    name: openlocale
    secret: openlocale-secret

enablePasswordDB: true
staticPasswords:
  - email: admin@example.com
    # bcrypt of "password"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
