# Daily reset of the openlocale demo to its pristine seeded state.
#
# The "demo" project is public and world-editable, and /signup is open to
# anyone — without this, stranger edits/spam/junk accounts would accumulate
# forever. This CronJob restores the whole SQLite file (every user, org, and
# project — not just the seeded "demo" project) from a pristine snapshot
# taken right after `pnpm seed`.
#
# How the snapshot works: /data/openlocale.seed.db on the same PVC used by
# deploy/k8s/demo.yaml is a byte-for-byte copy of openlocale.db taken while
# the app was stopped (so SQLite had already checkpointed its WAL — no
# -wal/-shm inconsistency). Each run: scale the app to 0, overwrite
# openlocale.db with that snapshot, scale back to 1.
#
# One-time setup (after demo.yaml is already applied and running):
#   pnpm seed   # locally, or use the already-seeded live DB as the source
#   kubectl -n openlocale-demo scale deployment/openlocale-demo --replicas=0
#   kubectl -n openlocale-demo wait --for=delete pod -l app=openlocale-demo --timeout=60s
#   kubectl -n openlocale-demo run db-loader --restart=Never --image=busybox:latest \
#     --overrides='{"spec":{"containers":[{"name":"db-loader","image":"busybox:latest","command":["sleep","300"],"volumeMounts":[{"name":"data","mountPath":"/data"}]}],"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"openlocale-demo-data"}}]}}'
#   kubectl -n openlocale-demo exec db-loader -- cp /data/openlocale.db /data/openlocale.seed.db
#   kubectl -n openlocale-demo delete pod db-loader
#   kubectl -n openlocale-demo scale deployment/openlocale-demo --replicas=1
#   kubectl apply -f demo-reset.yaml
#
# Re-run those steps any time you want to refresh what "pristine" means
# (e.g. after editing tools/seed/seed.ts).
#
# To change the schedule or trigger a reset by hand:
#   kubectl -n openlocale-demo create job --from=cronjob/openlocale-demo-reset manual-reset-1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openlocale-demo-resetter
  namespace: openlocale-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openlocale-demo-resetter
  namespace: openlocale-demo
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openlocale-demo-resetter
  namespace: openlocale-demo
subjects:
  - kind: ServiceAccount
    name: openlocale-demo-resetter
    namespace: openlocale-demo
roleRef:
  kind: Role
  name: openlocale-demo-resetter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openlocale-demo-reset
  namespace: openlocale-demo
spec:
  schedule: "0 9 * * *" # 09:00 UTC daily — edit to taste
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: openlocale-demo-resetter
          restartPolicy: Never
          containers:
            - name: reset
              image: alpine/k8s:1.34.3
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  kubectl -n openlocale-demo patch deployment openlocale-demo --type=merge -p '{"spec":{"replicas":0}}'
                  kubectl -n openlocale-demo wait --for=delete pod -l app=openlocale-demo --timeout=60s
                  cp /data/openlocale.seed.db /data/openlocale.db
                  rm -f /data/openlocale.db-wal /data/openlocale.db-shm
                  kubectl -n openlocale-demo patch deployment openlocale-demo --type=merge -p '{"spec":{"replicas":1}}'
                  kubectl -n openlocale-demo rollout status deployment/openlocale-demo --timeout=120s
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests: { memory: 64Mi }
                limits: { memory: 128Mi }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: openlocale-demo-data
